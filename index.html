<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dristick Tester — отправить отчёт</title>
<style>
  :root { --bg:#0e0f13; --card:#171922; --line:#2a2d3a; --text:#e8e9ee; --muted:#9a9db0; --accent:#ff4d4d; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { margin:0 0 8px; color:var(--muted); font-size:14px; }
  label { display:block; margin:14px 0 6px; font-size:13px; color:var(--muted); }
  input, select, textarea { width:100%; padding:11px 12px; background:#0f1117; color:var(--text);
         border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:110px; resize:vertical; }
  button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin-top:14px; min-height:20px; font-size:14px; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>🕹️ Dristick Tester</h1>
    <p class="sub">Отправь отчёт разработчику</p>

    <form id="reportForm">
      <label for="nickname">Никнейм *</label>
      <input id="nickname" maxlength="64" required>

      <label for="telegram">Telegram (@username — чтобы получить уведомление о статусе)</label>
      <input id="telegram" maxlength="33" placeholder="@username">

      <label for="title">Желаемый титул</label>
      <input id="title" maxlength="64">

      <label for="type">Категория</label>
      <select id="type">
        <option>Баг</option>
        <option>Идея</option>
        <option>Геймплей</option>
      </select>

      <label for="media">Ссылка на скриншот / видео</label>
      <input id="media" maxlength="500" placeholder="https://...">

      <label for="description">Описание</label>
      <textarea id="description" maxlength="2000"></textarea>

      <button id="send" type="submit">Отправить отчёт</button>
      <div id="status"></div>
    </form>
  </div>

<script>
    const API_URL = "https://dristick-tester-bot.onrender.com/api/report";

    const form = document.getElementById("reportForm");
    const btn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const val = id => document.getElementById(id).value.trim();

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (API_URL.includes("YOUR-SERVICE")) {
            setStatus("Укажи адрес сервиса в API_URL (index.html)", "err");
            return;
        }

        btn.disabled = true;
        setStatus("Отправка… сервер может просыпаться до минуты");

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 90000);

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nickname: val("nickname"),
                    telegram: val("telegram"),
                    title: val("title"),
                    type: val("type"),
                    media: val("media"),
                    description: val("description")
                }),
                signal: ctrl.signal
            });
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.ok) {
                setStatus("✅ Отчёт успешно отправлен!", "ok");
                form.reset();
            } else if (res.status === 429) {
                setStatus("Слишком часто, подожди минуту", "err");
            } else {
                setStatus("❌ Ошибка отправки (" + res.status + ")", "err");
            }
        } catch (err) {
            console.error(err);
            setStatus("❌ Нет связи с сервером", "err");
        } finally {
            clearTimeout(timer);
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
