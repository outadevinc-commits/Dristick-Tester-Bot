<script>
    const BOT_TOKEN = "8839895562:AAELe4fHssbswyDOCg2WPmfJ26lnRPmoRgM";
    const CHAT_ID = "5876046214";

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const nick = document.getElementById('nickname').value;
        const tg = document.getElementById('telegram').value;
        const title = document.getElementById('title').value || "Не указан";
        const type = document.getElementById('type').value;
        const media = document.getElementById('media').value;
        const desc = document.getElementById('description').value || "Без описания";

        const text = `📬 **НОВЫЙ ОТЧЁТ (Dristick Tester)**\n\n` +
                     `👤 **Никнейм:** ${nick}\n` +
                     `📱 **Telegram:** ${tg}\n` +
                     `👑 **Титул:** ${title}\n` +
                     `📌 **Категория:** ${type}\n\n` +
                     `🔗 **Медиа:** ${media}\n` +
                     `📝 **Описание:** ${desc}`;

        // Кнопки, которые прикрепятся к сообщению
        const reply_markup = {
            inline_keyboard: [
                [
                    { text: "✅ Принято (+5)", callback_data: "status_accept_1" },
                    { text: "🐛 Баг (+10)", callback_data: "status_bug_1" }
                ],
                [
                    { text: "👑 Титул (+15)", callback_data: "grant_title_1" },
                    { text: "❌ Отклонить", callback_data: "status_reject_1" }
                ]
            ]
        };

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'Markdown',
                reply_markup: reply_markup
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.ok) {
                alert('✅ Отчёт успешно отправлен!');
                document.getElementById('reportForm').reset();
            } else {
                alert('❌ Ошибка отправки.');
            }
        })
        .catch(error => {
            alert('❌ Ошибка сети!');
            console.error(error);
        });
    });
</script>
